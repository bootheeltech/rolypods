<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RolyPods post: restock</title>
<style>
@font-face { font-family: "Geist"; src: url("../../../fonts/Geist-Variable-latin.woff2") format("woff2"); font-weight: 100 900; }
:root {
  --bark: #4a3626; --bark-dark: #2e2013; --moss: #4c6b4f; --moss-dark: #33492f;
  --cream: #f6f1e4; --cream-dark: #e7dcc4; --blush: #d1477a; --blush-dark: #a8355f; --ink: #241d15;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: "Geist", "Segoe UI", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.serif { font-family: Georgia, "Times New Roman", serif; font-weight: 700; letter-spacing: -0.01em; }
.caps { text-transform: uppercase; letter-spacing: 0.2em; font-weight: 600; }
.dot { color: var(--blush); }
img { display: block; }

html, body { width: 1080px; height: 1350px; overflow: hidden; }
.post { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
.pill { display: inline-block; padding: 14px 28px; border-radius: 999px; font-size: 26px; }

.post { background: var(--cream); }
.bigbug { position: absolute; right: -30px; bottom: 10px; width: 600px; transform: rotate(-18deg); }
.content { position: absolute; left: 80px; top: 96px; right: 80px; }
.pill { background: var(--blush); color: var(--cream); margin-bottom: 64px; }
h1 { color: var(--bark); font-size: 128px; line-height: 0.98; margin-bottom: 44px; }
p.body { color: var(--bark); font-size: 38px; line-height: 1.42; max-width: 760px; }
.foot { position: absolute; left: 80px; bottom: 80px; }
.foot img { height: 72px; margin-bottom: 18px; }
.cta { color: var(--moss); font-size: 30px; font-weight: 600; }
</style></head>
<body><div class="post">
  <img class="bigbug" src="../../../logo/svg/rolypods-mark-light.svg" alt="">
  <div class="content">
    <div class="pill caps"><!-- EDIT label -->Back in stock</div>
    <h1 class="serif"><!-- EDIT headline -->The cows<br>are back<span class="dot">.</span></h1>
    <p class="body"><!-- EDIT body -->Dairy Cow isopods are restocked. Containers of 25, shipping Monday through Wednesday so nobody spends a weekend in a warehouse.</p>
  </div>
  <div class="foot"><img src="../../../logo/svg/rolypods-wordmark-light.svg" alt="RolyPods"><div class="cta"><!-- EDIT call to action -->rolypods.com/shop</div></div>
</div></body></html>
