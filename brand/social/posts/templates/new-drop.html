<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RolyPods post: new-drop</title>
<style>
@font-face { font-family: "Geist"; src: url("../../../fonts/Geist-Variable-latin.woff2") format("woff2"); font-weight: 100 900; }
:root {
  --bark: #4a3626; --bark-dark: #2e2013; --moss: #4c6b4f; --moss-dark: #33492f;
  --cream: #f6f1e4; --cream-dark: #e7dcc4; --blush: #d1477a; --blush-dark: #a8355f; --ink: #241d15;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: "Geist", "Segoe UI", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.serif { font-family: Georgia, "Times New Roman", serif; font-weight: 700; letter-spacing: -0.01em; }
.caps { text-transform: uppercase; letter-spacing: 0.2em; font-weight: 600; }
.dot { color: var(--blush); }
img { display: block; }

html, body { width: 1080px; height: 1350px; overflow: hidden; }
.post { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
.pill { display: inline-block; padding: 14px 28px; border-radius: 999px; font-size: 26px; }

.post { background: var(--bark); }
.photo { position: absolute; inset: 0 0 auto 0; height: 840px; background: url("../../../../public/photos/dairy-cow-isopods-2-closeup.jpg") center 40% / cover; }
.photo::after { content: ""; position: absolute; inset: auto 0 0 0; height: 180px; background: linear-gradient(transparent, var(--bark)); }
.pill { position: absolute; top: 56px; left: 56px; background: var(--blush); color: var(--cream); }
.panel { position: absolute; left: 72px; right: 72px; bottom: 64px; }
h1 { color: var(--cream); font-size: 112px; line-height: 1.0; margin-bottom: 22px; }
.sub { color: var(--cream-dark); font-size: 34px; line-height: 1.4; margin-bottom: 56px; }
.foot { display: flex; justify-content: space-between; align-items: center; border-top: 2px solid rgba(246,241,228,.18); padding-top: 34px; }
.cta { color: var(--blush); font-size: 34px; font-weight: 600; }
.foot img { height: 58px; }
</style></head>
<body><div class="post">
  <div class="photo"></div>
  <div class="pill caps"><!-- EDIT label -->New drop</div>
  <div class="panel">
    <h1 class="serif"><!-- EDIT title -->Dairy Cow Isopods<span class="dot">.</span></h1>
    <p class="sub"><!-- EDIT subline --><i>Porcellio laevis</i> · captive-bred · containers of 25. Big, fast, and patched like tiny Holsteins.</p>

  </div>
</div></body></html>
